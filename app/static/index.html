<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finsolve Technologies — Enterprise AI Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230b223f' width='100' height='100'/><text x='50' y='65' font-size='60' font-weight='bold' fill='%23d4af37' text-anchor='middle'>FT</text></svg>" />

<style>
/* ------------ RESET & VARIABLES ----------- */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0b223f;--navy-dark:#051628;--navy-light:#1a3a5c;
  --teal:#0fb2a6;--teal-dark:#0a8577;--teal-light:#1fc9be;
  --gold:#d4af37;--gold-light:#e8c547;
  --bg-light:#f4f7fb;--bg-lighter:#fbfdff;--bg-dark:#f0f2f5;
  --card-white:#ffffff;--text-dark:#071024;--text-muted:#6b7280;
  --text-light:#9ca3af;--border-light:#e6eef6;--border-muted:#d1dce6;
}

/* ------------ PAGE ----------- */
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial;
  background:linear-gradient(180deg,var(--bg-light),#eef2f8);
  height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;color:var(--text-dark);
}

/* ------------ CONTAINER ----------- */
.container{
  width:100%;max-width:1200px;height:92vh;background:var(--card-white);
  border-radius:16px;box-shadow:0 20px 60px rgba(8,30,60,0.2);
  display:grid;grid-template-columns:380px 1fr;overflow:hidden;
}

/* ------------ LOGIN PANEL (unchanged UI) ----------- */
.login-panel{background:linear-gradient(180deg,var(--navy),var(--navy-dark));color:#fff;padding:48px 36px;display:flex;flex-direction:column;gap:28px;overflow-y:auto;position:relative;}
.login-panel::before{content:'';position:absolute;top:0;right:0;width:300px;height:300px;background:radial-gradient(circle,rgba(15,178,166,0.1) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.logo-box{width:68px;height:68px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--text-dark);font-size:24px;box-shadow:0 8px 24px rgba(212,175,55,0.35);}
.brand-section{display:flex;align-items:center;gap:16px;}
.brand-text h1{font-size:24px;font-weight:800;margin:0;color:#fff;}
.brand-text p{font-size:12px;color:#a8c5e0;margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);}
.pitch-text{font-size:14px;line-height:1.7;color:#dbe8f6;}
.pitch-text strong{color:var(--teal-light);}
.login-form{background:rgba(255,255,255,0.06);padding:24px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(10px);}
.form-group{display:flex;flex-direction:column;gap:8px;}
.form-group label{font-size:11px;font-weight:700;color:#b8d4e8;text-transform:uppercase;letter-spacing:1px;}
.form-group input{padding:12px 14px;border:1.5px solid rgba(255,255,255,0.12);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;font-size:14px;}
.login-btn{padding:13px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#052427;border:none;border-radius:10px;font-weight:800;cursor:pointer;text-transform:uppercase;}
.demo-note{font-size:12px;color:rgba(255,255,255,0.68);background:rgba(15,178,166,0.08);padding:12px;border-radius:8px;border-left:3px solid var(--teal);}
.login-footer{margin-top:auto;padding-top:24px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px;color:rgba(255,255,255,0.55);text-transform:uppercase;}

/* ------------ CHAT PANEL ----------- */
.chat-panel{display:flex;flex-direction:column;background:linear-gradient(180deg,#fafbfc,var(--bg-light));min-height:0;}

/* HEADER */
.chat-header{padding:18px 28px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;background:var(--card-white);box-shadow:0 2px 12px rgba(8,30,60,0.06);}
.user-section{display:flex;align-items:center;gap:16px;}
.user-avatar{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy-light));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold);font-size:20px;}
.logout-btn{padding:9px 18px;border:1.5px solid var(--border-light);border-radius:10px;background:#fafbfc;color:var(--navy);cursor:pointer;font-weight:700;}

/* MESSAGES */
.messages-container{
  flex:1 1 auto;
  min-height:0;
  max-height:calc(100% - 140px);
  padding:28px;display:flex;flex-direction:column;gap:16px;
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch;
}

/* BUBBLES */
.message{display:flex;gap:12px;}
.message.user-msg{justify-content:flex-end;}
.message-bubble{
  max-width:75%;
  padding:13px 16px;border-radius:14px;
  line-height:1.6;font-size:14px;
  box-shadow:0 2px 10px rgba(8,30,60,0.08);
  white-space:pre-wrap;
  word-break:break-word !important;
  overflow-wrap:anywhere !important;
}
.ai-bubble{background:var(--card-white);color:var(--text-dark);border:1px solid var(--border-light);border-left:3px solid var(--navy);}
.user-bubble{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;border-bottom-right:3px solid var(--teal);}
.ai-sender{font-weight:800;color:var(--navy);font-size:11px;margin-bottom:6px;display:block;text-transform:uppercase;}
.message-time{font-size:11px;color:var(--text-light);margin-top:6px;display:block;font-weight:500;}
.user-msg .message-time{color:rgba(255,255,255,0.65);}

/* CHAT FOOTER */
.chat-footer{padding:18px 28px;background:var(--card-white);border-top:1px solid var(--border-light);display:flex;gap:14px;align-items:flex-end;flex-shrink:0;}
#messageInput{flex:1;padding:13px 16px;border:1.5px solid var(--border-light);border-radius:12px;font-size:14px;min-height:46px;max-height:120px;resize:none;}
#sendBtn{padding:12px 22px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#052427;border:none;border-radius:12px;font-weight:800;cursor:pointer;}
#messageInput:disabled,#sendBtn:disabled{opacity:.6;cursor:not-allowed;}

/* MOBILE */
@media(max-width:900px){.container{grid-template-columns:1fr;} .login-panel{display:none;} .chat-panel{height:92vh;}}

/* SCROLL */
.messages-container::-webkit-scrollbar{width:8px;}
.messages-container::-webkit-scrollbar-thumb{background:var(--border-muted);border-radius:4px;}
</style>
</head>

<body>
<div class="container">
  <!-- LOGIN PANEL REMAINS THE SAME -->
  <div class="login-panel">
    <div class="brand-section"><div class="logo-box">FT</div><div class="brand-text"><h1>Finsolve</h1><p>Enterprise AI</p></div></div>
    <div class="divider"></div>
    <div class="pitch-text">Access <strong>role-specific documents</strong> and receive <strong>compliant, actionable answers</strong>.</div>
    <form class="login-form" id="loginForm" onsubmit="return false;">
      <div class="form-group"><label>Username</label><input id="username" type="text" /></div>
      <div class="form-group"><label>Password</label><input id="password" type="password" /></div>
      <button type="button" class="login-btn" id="btnLogin">Sign In</button>
      <div class="demo-note"><strong>Demo:</strong> Tony • Bruce • Sam • Natasha</div>
    </form>
    <div class="login-footer">Authorized Personnel Only</div>
  </div>

  <!-- CHAT PANEL -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="user-section"><div class="user-avatar" id="avatar">U</div>
        <div class="user-details"><h2 id="displayName">Not Signed In</h2><p id="displayRole">Role: <span>—</span></p></div>
      </div>
      <button class="logout-btn" id="logoutBtn" style="display:none">Logout</button>
    </div>

    <div class="messages-container" id="messagesContainer"></div>

    <div class="chat-footer">
      <textarea id="messageInput" placeholder="Ask about financial policies or budgets..." disabled></textarea>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>
</div>

<script>
const btnLogin=document.getElementById('btnLogin'),logoutBtn=document.getElementById('logoutBtn'),
usernameEl=document.getElementById('username'),passwordEl=document.getElementById('password'),
displayName=document.getElementById('displayName'),displayRole=document.getElementById('displayRole'),
avatar=document.getElementById('avatar'),messagesContainer=document.getElementById('messagesContainer'),
messageInput=document.getElementById('messageInput'),sendBtn=document.getElementById('sendBtn');

let authHeader=null,currentUser=null,currentRole=null,isSending=false;

function scrollBottom(){requestAnimationFrame(()=>{messagesContainer.scrollTop=messagesContainer.scrollHeight;});}

/* ADD MESSAGE */
function addMessage(text,sender='ai'){
  const wrap=document.createElement('div');wrap.className=`message ${sender==='user'?'user-msg':'ai-msg'}`;
  const bubble=document.createElement('div');bubble.className=`message-bubble ${sender==='user'?'user-bubble':'ai-bubble'}`;
  if(sender==='ai'){const lab=document.createElement('span');lab.className='ai-sender';lab.textContent='Finsolve AI';bubble.appendChild(lab);}
  bubble.appendChild(document.createElement('div')).textContent=text;
  const t=document.createElement('span');t.className='message-time';t.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});bubble.appendChild(t);
  wrap.appendChild(bubble);messagesContainer.appendChild(wrap);scrollBottom();
  return wrap;
}

/* TYPING INDICATOR */
function typing(on=true){
  if(on){return addMessage("⏳ AI is typing...","ai").id="typing-temp";}
  const el=document.getElementById("typing-temp");if(el)el.remove();
}

/* LOGIN */
async function login(){
  const user=usernameEl.value.trim(),pass=passwordEl.value;if(!user||!pass)return alert('Enter credentials');
  authHeader='Basic '+btoa(user+':'+pass);btnLogin.disabled=true;
  try{
    const r=await fetch('/login',{headers:{Authorization:authHeader}});
    if(r.status===401)return alert('Invalid user');const data=await r.json();
    currentUser=user;currentRole=data.role||'Unknown';
    displayName.textContent=currentUser;displayRole.innerHTML=`Role: <span>${currentRole}</span>`;
    avatar.textContent=currentUser[0].toUpperCase();messageInput.disabled=false;sendBtn.disabled=false;
    logoutBtn.style.display='inline-block';usernameEl.value='';passwordEl.value='';
    messagesContainer.innerHTML='';addMessage(`Welcome, ${currentUser}! You're signed in as ${currentRole}.`,'ai');
  }catch(e){alert('Network/Login error');}finally{btnLogin.disabled=false;}
}

/* SEND MESSAGE */
async function sendMessage(){
  if(isSending)return; const t=messageInput.value.trim(); if(!t)return;
  if(!authHeader)return alert('Login first');isSending=true;sendBtn.disabled=true;
  addMessage(t,'user');messageInput.value='';messageInput.style.height='auto';typing(true);
  try{
    const r=await fetch('/chat?message='+encodeURIComponent(t),{method:'POST',headers:{Authorization:authHeader}});
    typing(false); if(r.status===401){logout();return alert('Session expired');}
    const data=await r.json();addMessage(data.response||'No response','ai');
  }catch(e){typing(false);addMessage('⚠️ Error: Unable to reach server','ai');}
  finally{isSending=false;sendBtn.disabled=false;messageInput.focus();}
}

/* LOGOUT */
function logout(){authHeader=null;currentUser=null;currentRole=null;
displayName.textContent='Not Signed In';displayRole.innerHTML='Role: <span>—</span>';
avatar.textContent='U';messageInput.disabled=true;sendBtn.disabled=true;logoutBtn.style.display='none';messagesContainer.innerHTML='';}

/* EVENTS */
btnLogin.onclick=login;logoutBtn.onclick=logout;sendBtn.onclick=sendMessage;
messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
messageInput.addEventListener('input',()=>{messageInput.style.height='auto';messageInput.style.height=Math.min(messageInput.scrollHeight,120)+'px';});

logout(); // reset initial state
</script>
</body>
</html>
